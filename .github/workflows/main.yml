name: Debug Windows Runner with sshx (PowerShell)
on: [workflow_dispatch]

jobs:
  debug:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and execute sshx
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://sshx.io/get" -OutFile "get_sshx.sh"
          # Executing via the built-in bash subshell to parse the installation script
          bash get_sshx.sh run
