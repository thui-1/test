name: Windows ARM64 Secure RDP

on: 
  workflow_dispatch: # Allows you to trigger the session manually

jobs:
  rdp-session:
    runs-on: windows-11-arm # Uses the standard Windows 11 ARM64 hosted runner
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Tailscale via Chocolatey
        run: |
          choco install tailscale -y
          refreshenv

      - name: Connect to Tailscale Network
        shell: cmd
        run: |
          "C:\Program Files\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --accept-routes

      - name: Configure Windows User and Enable RDP
        shell: powershell
        run: |
          # 1. Create a local administrator account
          $Password = ConvertTo-SecureString "29122012@Taryel" -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $Password -Description "RDP Admin User"
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

          # 2. Enable Remote Desktop (RDP) Service
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          # 3. Configure Firewall specifically for the Tailscale adapter interface
          Set-NetFirewallRule -DisplayGroup "Remote Desktop" -Profile Private,Public,Domain -Enabled True

      - name: Fetch and Display Tailscale IP Address
        shell: powershell
        run: |
          Write-Host "===================================================="
          Write-Host "Tailscale IP to connect via RDP:"
          "C:\Program Files\Tailscale\tailscale.exe" ip -4
          Write-Host "Username: RDP"
          Write-Host "Password: 29122012@Taryel"
          Write-Host "===================================================="

      - name: Keep Runner Alive (6-Hour GitHub Limit)
        shell: powershell
        run: |
          # Keeps the job running so your RDP session doesn't instantly close
          $Timeout = New-TimeSpan -Hours 5 -Minutes 50
          $Stopwatch = [System.Diagnostics.Stopwatch]::StartNew()
          while ($Stopwatch.Elapsed -lt $Timeout) {
              Start-Sleep -Seconds 60
          }
