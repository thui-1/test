name: Windows ARM64 Debugging with tmate

on: 
  workflow_dispatch: # Lazım olduqda paneldən əl ilə başladılması üçün

jobs:
  debug-windows-arm:
    # Rəsmi Windows 11 ARM64 runner-i çağırmaq üçün təyin edilən etiket
    runs-on: windows-11-arm

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Sazlama (debugging) sessiyasını başlatan əsas tmate addımı
      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        with:
          # Əgər tmate-in sessiyanı bloklamasını və siz çıxana qədər gözləməsini istəyirsinizsə:
          detached: false
          # Profilinizdəki SSH açarlarını qeydiyyatdan keçiribsə, yalnız siz qoşula bilərsiniz
          limit-access-to-actor: true
